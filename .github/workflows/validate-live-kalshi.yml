name: Live Kalshi Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - "app.py"
      - "requirements.txt"
      - "scripts/validate_live_kalshi.py"
      - "scripts/run_operational_cycle.py"
      - "tests/**"
      - "migrations/**"
      - ".github/workflows/validate-live-kalshi.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          pip install pytest
          pytest -q
      - name: Validate Streamlit app imports
        run: python -m py_compile app.py
      - name: Validate live Kalshi payloads
        run: python -m scripts.validate_live_kalshi
      - name: Smoke test operational research path
        run: python -m scripts.run_operational_cycle --smoke
